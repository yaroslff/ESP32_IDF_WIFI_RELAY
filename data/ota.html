<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTA Обновление</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            margin: 0;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #2d3748;
            font-size: 24px;
            text-align: center;
            margin-bottom: 25px;
        }
        .section {
            background: #f7fafc;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #e2e8f0;
        }
        .section h2 {
            font-size: 18px;
            color: #4a5568;
            margin-top: 0;
            margin-bottom: 15px;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            box-shadow: 0 6px 20px rgba(72, 187, 120, 0.4);
            transform: translateY(-2px);
        }
        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-blue {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .btn-blue:hover {
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.4);
        }
        .progress-bar {
            width: 100%;
            height: 12px;
            background-color: #e2e8f0;
            border-radius: 6px;
            margin-top: 20px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.2s ease;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #4a5568;
            text-align: center;
            font-weight: 500;
        }
        .nav-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Обновление системы (OTA)</h1>
        
        <!-- Блок обновления исполняемого кода -->
        <div class="section">
            <h2>1. Обновить прошивку (Код)</h2>
            <input type="file" id="firmwareFile" accept=".bin">
            <button class="btn" id="btnFirmware" onclick="startOTA('/update', 'firmwareFile')">Загрузить прошивку</button>
            <div style="font-size: 12px; color: #a0aec0; margin-top: 8px;">Файл: build/ваше_название.bin</div>
        </div>

        <!-- Блок обновления веб-интерфейса -->
        <div class="section">
            <h2>2. Обновить веб-интерфейс (SPIFFS)</h2>
            <input type="file" id="spiffsFile" accept=".bin">
            <button class="btn btn-blue" id="btnSpiffs" onclick="startOTA('/update_spiffs', 'spiffsFile')">Загрузить файлы сайта</button>
            <div style="font-size: 12px; color: #a0aec0; margin-top: 8px;">Файл: build/spiffs.bin</div>
        </div>
        
        <div class="progress-bar" id="progressContainer">
            <div class="progress-fill" id="progressBar"></div>
        </div>
        
        <div id="status">Выберите нужный файл и нажмите кнопку</div>

        <a href="/" class="nav-link">Вернуться на главную</a>
    </div>

    <script>
        function startOTA(uploadUrl, inputId) {
            const fileInput = document.getElementById(inputId);
            const file = fileInput.files[0];
            const btnFw = document.getElementById('btnFirmware');
            const btnSp = document.getElementById('btnSpiffs');
            const status = document.getElementById('status');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');

            if (!file) {
                status.style.color = '#e53e3e';
                status.innerText = 'Ошибка: Сначала выберите файл!';
                return;
            }

            if (!file.name.endsWith('.bin')) {
                status.style.color = '#e53e3e';
                status.innerText = 'Ошибка: Файл должен иметь расширение .bin';
                return;
            }

            // Блокируем кнопки
            btnFw.disabled = true;
            btnSp.disabled = true;
            progressContainer.style.display = 'block';
            status.style.color = '#4a5568';
            status.innerText = 'Идёт загрузка и установка... Не закрывайте страницу.';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', uploadUrl, true);
            
            // Отправляем как сырой бинарник
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percent + '%';
                    status.innerText = `Загружено: ${percent}%`;
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200 && xhr.responseText === "OK") {
                    status.style.color = '#38a169';
                    status.innerText = 'Успешно! Устройство перезагружается...';
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 5000);
                } else {
                    status.style.color = '#e53e3e';
                    status.innerText = 'Ошибка обновления: ' + xhr.responseText;
                    btnFw.disabled = false;
                    btnSp.disabled = false;
                }
            };

            xhr.onerror = function() {
                status.style.color = '#e53e3e';
                status.innerText = 'Ошибка сети при передаче файла.';
                btnFw.disabled = false;
                btnSp.disabled = false;
            };

            xhr.send(file);
        }
    </script>
</body>
</html>
