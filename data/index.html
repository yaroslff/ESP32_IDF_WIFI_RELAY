<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-out;
            margin: 30px auto;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 56px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            color: #2d3748;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #718096;
            font-size: 16px;
            margin-bottom: 35px;
            line-height: 1.5;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: left;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .btn:active {
            transform: translateY(-1px);
            animation: buttonPress 0.2s ease;
        }

        @keyframes buttonPress {
            0%, 100% {
                transform: translateY(-3px) scale(1);
            }
            50% {
                transform: translateY(-1px) scale(0.98);
            }
        }

        /* Разные цвета для разных кнопок */
        .btn-wifi {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .btn-wifi:hover {
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5);
        }

        .btn-mqtt {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.3);
        }

        .btn-mqtt:hover {
            box-shadow: 0 8px 25px rgba(250, 112, 154, 0.5);
        }

        .btn-relay {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-relay:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
        }

        .btn-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .btn-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.2;
        }

        .btn-description {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.9;
            line-height: 1.3;
        }

        .btn-arrow {
            font-size: 20px;
            opacity: 0.7;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .btn:hover .btn-arrow {
            transform: translateX(5px);
            opacity: 1;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(72, 187, 120, 0.15);
            color: #38a169;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(72, 187, 120, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #48bb78;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.6;
                transform: scale(0.9);
            }
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e2e8f0, transparent);
            margin: 25px 0;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #a0aec0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .footer-version {
            font-size: 11px;
            color: #cbd5e0;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 30px 20px;
                border-radius: 20px;
                margin: 15px auto;
            }

            h1 {
                font-size: 26px;
            }

            .subtitle {
                font-size: 14px;
            }

            .btn {
                padding: 15px 20px;
            }

            .btn-icon {
                font-size: 24px;
            }

            .btn-title {
                font-size: 15px;
            }

            .btn-description {
                font-size: 12px;
            }

            .logo {
                font-size: 48px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 25px 15px;
            }

            h1 {
                font-size: 22px;
            }

            .btn {
                padding: 12px 16px;
                gap: 12px;
            }

            .btn-icon {
                font-size: 22px;
            }
        }

        /* Темная тема для систем с поддержкой */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            }

            .container {
                background: rgba(45, 55, 72, 0.95);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            }

            h1 {
                background: linear-gradient(135deg, #90cdf4 0%, #b794f4 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .subtitle {
                color: #cbd5e0;
            }

            .footer {
                color: #718096;
            }

            .status-badge {
                background: rgba(72, 187, 120, 0.2);
                border-color: rgba(72, 187, 120, 0.4);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏠</div>
        <h1>Добро пожаловать!</h1>
        <p class="subtitle">Это главная страница вашего умного устройства</p>
        
        <div class="status-badge">
            <span class="status-dot"></span>
            Система активна
        </div>
        
        <!-- Кнопки навигации -->
        <div class="button-container">
            <a href="/wifiset.html" class="btn btn-wifi">
                <span class="btn-icon">📶</span>
                <div class="btn-content">
                    <span class="btn-title">Настройки Wi-Fi</span>
                    <span class="btn-description">Подключение к сети</span>
                </div>
                <span class="btn-arrow">→</span>
            </a>
            
            <a href="/mqttset.html" class="btn btn-mqtt">
                <span class="btn-icon">🔌</span>
                <div class="btn-content">
                    <span class="btn-title">Настройки MQTT</span>
                    <span class="btn-description">Сервер и авторизация</span>
                </div>
                <span class="btn-arrow">→</span>
            </a>
            
            <a href="/relay.html" class="btn btn-relay">
                <span class="btn-icon">⚡</span>
                <div class="btn-content">
                    <span class="btn-title">Управление реле</span>
                    <span class="btn-description">4 реле и настройки</span>
                </div>
                <span class="btn-arrow">→</span>
            </a>
        </div>

        <div class="divider"></div>
        
        <!-- Подвал -->
        <div class="footer">
            <p>ESP32 Web Server by Yaroslff</p>
            <span class="footer-version">v1.0</span>
        </div>
    </div>

    <script>
        // Добавляем плавную анимацию при загрузке
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach((btn, index) => {
                btn.style.opacity = '0';
                btn.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    btn.style.transition = 'all 0.5s ease';
                    btn.style.opacity = '1';
                    btn.style.transform = 'translateY(0)';
                }, 100 + index * 100);
            });
        });

        // Эффект ripple при клике
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.5)';
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple 0.6s ease-out';
                ripple.style.pointerEvents = 'none';
                
                this.appendChild(ripple);
                
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Добавляем keyframe для ripple
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
